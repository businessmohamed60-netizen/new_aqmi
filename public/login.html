<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion NOVAQYS — AQMI</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --nova-bg:#0a0a0f;--nova-bg-card:#14141f;--nova-bg-elevated:#1a1a2e;
  --nova-border:rgba(255,255,255,0.06);--nova-border-hover:rgba(255,255,255,0.15);
  --nova-text-primary:#EEF2F7;--nova-text-secondary:#a3b0c6;--nova-text-tertiary:#7a8a9e;
  --nova-text-muted:rgba(160,176,200,0.6);
  --nova-blue:#3b82f6;--nova-blue-glow:rgba(59,130,246,0.25);
  --radius-md:0.75rem;--radius-2xl:2rem;
  --font-display:'Manrope','Inter',sans-serif;--font-primary:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;background:var(--nova-bg)}
body{font-family:var(--font-primary);background:var(--nova-bg);color:var(--nova-text-primary);overflow-x:hidden;line-height:1.6}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input{font:inherit}

.aqmi-auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--nova-bg);
  background-image:radial-gradient(ellipse at 50% 30%,rgba(59,130,246,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(59,147,240,0.06) 0%,transparent 50%);
  position:relative;overflow:hidden;padding:1rem;
}
.aqmi-auth-wrap::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#3b82f6,transparent);
  background-size:200% 100%;animation:dataStream 4s ease infinite;z-index:2;
}
@keyframes dataStream{0%{background-position:-200% 0}100%{background-position:200% 0}}
.aqmi-orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.aqmi-orb-1{width:400px;height:400px;background:rgba(59,130,246,0.06);top:-10%;left:-10%;animation:orbFloat 20s ease-in-out infinite}
.aqmi-orb-2{width:300px;height:300px;background:rgba(59,147,240,0.05);bottom:-10%;right:-10%;animation:orbFloat 25s ease-in-out infinite reverse}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(0.9)}}

.aqmi-auth-card{
  background:var(--nova-bg-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--nova-border);border-radius:var(--radius-2xl);
  max-width:420px;width:100%;position:relative;z-index:1;overflow:hidden;padding:2.5rem;
  animation:fadeIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
}
.aqmi-auth-card::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,0.3),transparent);
  animation:speedLine 3s ease-in-out infinite;
}
@keyframes speedLine{0%{left:-100%}100%{left:200%}}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.aqmi-auth-header{text-align:center;margin-bottom:2rem}
.aqmi-logo{
  width:3.25rem;height:3.25rem;background:linear-gradient(135deg,#3b82f6,#5e50ee);
  border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;
  font-size:1.25rem;font-weight:800;color:#fff;margin:0 auto 1rem;
  box-shadow:0 8px 32px rgba(59,130,246,0.3);
}
.aqmi-auth-title{font-family:var(--font-display);font-size:1.25rem;font-weight:800;color:var(--nova-text-primary);letter-spacing:-0.02em;margin-bottom:0.25rem}
.aqmi-auth-sub{font-size:0.8125rem;color:var(--nova-text-tertiary);line-height:1.5}

.aqmi-form{display:flex;flex-direction:column;gap:1.25rem}
.aqmi-field{display:flex;flex-direction:column;gap:0.375rem}
.aqmi-label{font-size:0.75rem;font-weight:600;color:var(--nova-text-secondary);text-transform:uppercase;letter-spacing:0.04em}
.aqmi-input-wrap{position:relative;display:flex;align-items:center}
.aqmi-input-icon{position:absolute;left:0.875rem;font-size:0.8125rem;color:var(--nova-text-tertiary);pointer-events:none;z-index:1}
.aqmi-input{
  width:100%;padding:0.75rem 0.875rem 0.75rem 2.5rem;
  background:var(--nova-bg-elevated);border:1px solid var(--nova-border);
  border-radius:var(--radius-md);color:var(--nova-text-primary);font-size:0.875rem;
  transition:all 0.2s;outline:none;font-family:var(--font-primary);
}
.aqmi-input:focus{border-color:rgba(59,130,246,0.3);box-shadow:0 0 0 3px rgba(59,130,246,0.1);background:var(--nova-bg-card)}
.aqmi-input:hover{border-color:var(--nova-border-hover)}
.aqmi-input::placeholder{color:var(--nova-text-muted)}

.aqmi-pwd-toggle{position:absolute;right:0.75rem;color:var(--nova-text-tertiary);font-size:0.875rem;padding:0.25rem;transition:color 0.2s;background:none;border:none;cursor:pointer;z-index:1}
.aqmi-pwd-toggle:hover{color:var(--nova-text-secondary)}

.aqmi-btn-primary{
  display:inline-flex;align-items:center;justify-content:center;gap:0.625rem;
  padding:0.875rem 1.75rem;background:var(--nova-blue);color:#fff;
  font-weight:600;border-radius:var(--radius-md);font-size:0.9375rem;
  transition:all 0.2s;box-shadow:0 4px 20px var(--nova-blue-glow);
  border:none;cursor:pointer;width:100%;
}
.aqmi-btn-primary:hover{background:#2f6fe0;transform:translateY(-2px);box-shadow:0 8px 30px var(--nova-blue-glow)}
.aqmi-btn-primary:active{transform:translateY(0)}

.aqmi-auth-footer{textext-align:center;margin-top:1.5rem;font-size:0.8125rem;color:var(--nova-text-tertiary)}
.aqmi-link{color:var(--nova-text-secondary);transition:color 0.2s}
.aqmi-link:hover{color:var(--nova-text-primary)}
.aqmi-sep{margin:0 0.5rem;color:var(--nova-border)}

.aqmi-auth-divider{text-align:center;margin:1.5rem 0;position:relative}
.aqmi-auth-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--nova-border)}
.aqmi-auth-divider span{position:relative;background:var(--nova-bg-card);padding:0 1rem;font-size:0.6875rem;color:var(--nova-text-tertiary);text-transform:uppercase;letter-spacing:0.1em}

.aqmi-auth-security{text-align:center;font-size:0.75rem;color:var(--nova-text-tertiary);display:flex;align-items:center;justify-content:center;gap:0.5rem}
.aqmi-auth-security i{color:var(--nova-blue)}

.aqmi-alert{display:flex;align-items:center;gap:0.625rem;padding:0.625rem 0.875rem;border-radius:var(--radius-md);font-size:0.8125rem;font-weight:500;margin-bottom:1rem;line-height:1.4}
.aqmi-alert-error{background:rgba(244,63,94,0.08);border:1px solid rgba(244,63,94,0.15);color:#fb7185}
.aqmi-alert-success{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.15);color:#34d399}

.back-link{position:absolute;top:1.5rem;left:1.5rem;z-index:10;font-size:0.8125rem;color:var(--nova-text-tertiary);display:flex;align-items:center;gap:0.5rem;transition:color 0.2s}
.back-link:hover{color:var(--nova-text-primary)}
</style>
</head>
<body>
<a href="Landing.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour</a>
<div class="aqmi-auth-wrap">
  <div class="aqmi-orb aqmi-orb-1"></div>
  <div class="aqmi-orb aqmi-orb-2"></div>
  <div class="aqmi-auth-card">
    <div class="aqmi-auth-header">
      <div class="aqmi-logo">N</div>
      <h2 class="aqmi-auth-title">Connexion NOVAQYS</h2>
      <p class="aqmi-auth-sub">Plateforme de maturité qualité industrielle</p>
    </div>

    <div id="alertBox" class="aqmi-alert aqmi-alert-error" style="display:none;">
      <i class="fas fa-exclamation-circle"></i>
      <span id="alertMsg"></span>
    </div>

    <form id="loginForm" class="aqmi-form" autocomplete="off">
      <div class="aqmi-field">
        <label class="aqmi-label">Adresse email</label>
        <div class="aqmi-input-wrap">
          <i class="fas fa-envelope aqmi-input-icon"></i>
          <input type="email" name="email" id="email" class="aqmi-input" placeholder="vous@exemple.com" required autofocus>
        </div>
      </div>
      <div class="aqmi-field">
        <label class="aqmi-label">Mot de passe</label>
        <div class="aqmi-input-wrap">
          <i class="fas fa-lock aqmi-input-icon"></i>
          <input type="password" name="password" id="password" class="aqmi-input" placeholder="••••••••" required>
          <button type="button" class="aqmi-pwd-toggle" onclick="togglePwd(this)" aria-label="Afficher">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="aqmi-btn-primary">
        <span>Se connecter</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>

    <div class="aqmi-auth-footer" style="text-align:center;margin-top:1.5rem;font-size:0.8125rem;color:var(--nova-text-tertiary)">
      <a href="Landing.html" class="aqmi-link">Mot de passe oublié ?</a>
      <span class="aqmi-sep">·</span>
      <a href="Landing.html" class="aqmi-link">Retour à l'accueil</a>
    </div>

    <div class="aqmi-auth-divider">
      <span>Plateforme sécurisée</span>
    </div>

    <div class="aqmi-auth-security">
      <i class="fas fa-shield-halved"></i>
      <span>Protégé par OTP · Session chiffrée</span>
    </div>
  </div>
</div>

<script>
function togglePwd(btn){
  var input=btn.closest('.aqmi-input-wrap').querySelector('input');
  var icon=btn.querySelector('i');
  if(input.type==='password'){input.type='text';icon.className='fas fa-eye-slash';}
  else{input.type='password';icon.className='fas fa-eye';}
}

document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var alertBox=document.getElementById('alertBox');
  var alertMsg=document.getElementById('alertMsg');
  var email=document.getElementById('email').value;
  var password=document.getElementById('password').value;

  if(!email||!password){
    alertMsg.textContent='Veuillez remplir tous les champs.';
    alertBox.style.display='flex';
    return;
  }

  alertBox.style.display='none';
  alertBox.className='aqmi-alert aqmi-alert-success';
  alertBox.querySelector('i').className='fas fa-check-circle';
  alertMsg.textContent='Connexion en cours... Redirection vers votre tableau de bord.';
  alertBox.style.display='flex';

  setTimeout(function(){
    window.location.href='Landing.html';
  },1500);
});
</script>
</body>
</html>
